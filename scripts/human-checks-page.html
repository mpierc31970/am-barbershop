<title>CDS Punch List</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,600;75,800;100,400;100,500;100,600&family=JetBrains+Mono:wght@400;500&display=swap"
/>
<style>
  /* Layout: sticky progress bar over a two-column sheet (phase index left, punch items right); one column on phones. */
  :root {
    --bg: #eef1ef;
    --sheet: #fbfcfb;
    --ink: #17211d;
    --muted: #5b6863;
    --rule: #d5dcd8;
    --accent: #0e6a57;
    --accent-soft: #d9ece6;
    --ops: #2c5a8f;
    --ops-soft: #dfe8f4;
    --live: #9a5a00;
    --live-soft: #f7ead3;
    --done-ink: #8a9691;
    --focus: #0e6a57;
    --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:
      "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101614;
      --sheet: #161e1b;
      --ink: #e3ebe7;
      --muted: #95a39d;
      --rule: #2a3531;
      --accent: #4fc2a5;
      --accent-soft: #173a31;
      --ops: #8db6e8;
      --ops-soft: #1b2a3c;
      --live: #e7b062;
      --live-soft: #382a14;
      --done-ink: #66746e;
      --focus: #4fc2a5;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101614;
    --sheet: #161e1b;
    --ink: #e3ebe7;
    --muted: #95a39d;
    --rule: #2a3531;
    --accent: #4fc2a5;
    --accent-soft: #173a31;
    --ops: #8db6e8;
    --ops-soft: #1b2a3c;
    --live: #e7b062;
    --live-soft: #382a14;
    --done-ink: #66746e;
    --focus: #4fc2a5;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 0 64px;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--rule);
  }
  .top-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 14px 12px;
    display: grid;
    gap: 10px;
  }
  .title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 16px;
  }
  h1 {
    font-family: var(--display);
    font-stretch: 75%;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 0.01em;
    margin: 0;
    text-transform: uppercase;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
  }
  .meter {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .bar {
    flex: 1 1 260px;
    height: 10px;
    background: var(--rule);
    border-radius: 2px;
    overflow: hidden;
    min-width: 0;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .count {
    font-family: var(--mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .controls input[type="search"] {
    flex: 1 1 220px;
    min-width: 0;
    font: inherit;
    padding: 7px 10px;
    border: 1px solid var(--rule);
    background: var(--sheet);
    color: var(--ink);
    border-radius: 4px;
  }
  .chip {
    font: 500 13px var(--body);
    border: 1px solid var(--rule);
    background: var(--sheet);
    color: var(--ink);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    background: var(--ink);
    color: var(--sheet);
    border-color: var(--ink);
  }
  .status {
    font-size: 13px;
    color: var(--muted);
  }
  .status.warn {
    color: var(--live);
  }

  .layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 28px;
    padding-top: 22px;
  }
  nav.index {
    position: sticky;
    top: 150px;
    align-self: start;
    display: grid;
    gap: 2px;
    max-height: calc(100vh - 170px);
    overflow-y: auto;
  }
  nav.index a {
    display: grid;
    grid-template-columns: 34px 1fr auto;
    gap: 6px;
    align-items: baseline;
    padding: 5px 8px;
    border-radius: 4px;
    color: var(--ink);
    text-decoration: none;
    font-size: 13px;
  }
  nav.index a:hover {
    background: var(--sheet);
  }
  nav.index .pn {
    font-family: var(--mono);
    color: var(--muted);
    font-size: 12px;
  }
  nav.index .pc {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  nav.index a.clear .pc {
    color: var(--accent);
  }

  main {
    display: grid;
    gap: 26px;
    min-width: 0;
  }
  section.phase {
    background: var(--sheet);
    border: 1px solid var(--rule);
    border-radius: 6px;
    min-width: 0;
  }
  .phase-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 14px;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--rule);
  }
  .phase-head h2 {
    font-family: var(--display);
    font-stretch: 75%;
    font-weight: 800;
    font-size: 21px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0;
    text-wrap: balance;
  }
  .phase-head .tag {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
  }
  .phase-head .pcount {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  details.group {
    border-bottom: 1px solid var(--rule);
  }
  details.group:last-child {
    border-bottom: 0;
  }
  summary {
    list-style: none;
    cursor: pointer;
    padding: 10px 18px;
    display: flex;
    gap: 12px;
    align-items: baseline;
    font-weight: 600;
    font-size: 14px;
  }
  summary::-webkit-details-marker {
    display: none;
  }
  summary::before {
    content: "+";
    font-family: var(--mono);
    color: var(--muted);
    width: 12px;
    flex: none;
  }
  details[open] > summary::before {
    content: "\2212";
  }
  summary .gcount {
    margin-left: auto;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  ol.items {
    list-style: none;
    margin: 0;
    padding: 0 18px 8px;
    display: grid;
  }
  li.item {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr);
    gap: 4px 12px;
    padding: 10px 0;
    border-top: 1px dashed var(--rule);
  }
  li.item:first-child {
    border-top: 0;
  }
  li.item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 3px 0 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  li.item input[disabled] {
    cursor: not-allowed;
  }
  .body {
    min-width: 0;
    display: grid;
    gap: 4px;
  }
  .text {
    overflow-wrap: anywhere;
    max-width: 78ch;
  }
  .text code,
  .where code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--bg);
    padding: 0 3px;
    border-radius: 3px;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    align-items: baseline;
    font-size: 13px;
    color: var(--muted);
  }
  .where {
    font-family: var(--mono);
    font-size: 12px;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .kind {
    font: 600 11px var(--body);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 1px 7px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .kind.look {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .kind.ops {
    background: var(--ops-soft);
    color: var(--ops);
  }
  .kind.live {
    background: var(--live-soft);
    color: var(--live);
  }
  .prior {
    font-size: 13px;
    color: var(--muted);
    border-left: 2px solid var(--rule);
    padding-left: 8px;
    overflow-wrap: anywhere;
  }
  .note-btn {
    font: 500 12px var(--body);
    background: none;
    border: 0;
    color: var(--accent);
    cursor: pointer;
    padding: 0;
  }
  .note-btn[hidden] {
    display: none;
  }
  textarea.note {
    font: inherit;
    font-size: 13px;
    width: 100%;
    max-width: 78ch;
    min-height: 54px;
    padding: 6px 8px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: var(--bg);
    color: var(--ink);
    resize: vertical;
  }
  li.item.done .text {
    color: var(--done-ink);
    text-decoration: line-through;
    text-decoration-color: var(--rule);
  }
  li.item.done .kind {
    opacity: 0.55;
  }
  .ticked-at {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
  }
  .empty {
    padding: 30px 18px;
    color: var(--muted);
    text-align: center;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-size: 12px;
    color: var(--muted);
    align-items: center;
  }

  @media (max-width: 860px) {
    .layout {
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }
    nav.index {
      position: static;
      max-height: none;
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding-bottom: 4px;
    }
    nav.index a {
      display: flex;
      gap: 6px;
      flex: none;
      background: var(--sheet);
      border: 1px solid var(--rule);
    }
    nav.index .pt {
      display: none;
    }
    h1 {
      font-size: 23px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar i {
      transition: none;
    }
  }
</style>

<header class="top">
  <div class="top-inner">
    <div class="title-row">
      <h1>CDS Punch List</h1>
      <span class="sub"
        >Open checks from <code>.planning/HUMAN-CHECKS.md</code> after the v1.0
        build, grouped by phase. None of them block launch.</span
      >
    </div>
    <div class="meter">
      <div
        class="bar"
        role="progressbar"
        aria-label="Checks ticked"
        aria-valuemin="0"
        id="bar"
      >
        <i id="barfill"></i>
      </div>
      <span class="count" id="count">0 / 0 ticked</span>
    </div>
    <div class="controls">
      <input
        type="search"
        id="q"
        placeholder="Search checks, routes, plan numbers"
        aria-label="Search checks"
      />
      <button class="chip" id="k-look" data-kind="look" aria-pressed="false">
        Look and test
      </button>
      <button class="chip" id="k-ops" data-kind="ops" aria-pressed="false">
        Ops and deploy
      </button>
      <button class="chip" id="k-live" data-kind="live" aria-pressed="false">
        Needs live account
      </button>
      <button class="chip" id="hide" aria-pressed="false">Hide ticked</button>
      <span class="status" id="status">Connecting to saved ticks…</span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <nav class="index" id="index" aria-label="Phases"></nav>
    <main id="main"></main>
  </div>
</div>

<script type="application/json" id="data">
  __DATA__
</script>
<script>
  (function () {
    const DATA = JSON.parse(document.getElementById("data").textContent);
    const checks = DATA.checks;
    const byId = new Map(checks.map((c) => [c.id, c]));
    const ticks = new Map(); // id -> {done, note, at}
    const rows = new Map(); // id -> {li, box, noteBtn, noteBox, stamp}
    let db = null,
      me = "",
      writable = false;
    const filters = { kinds: new Set(), q: "", hide: false };

    const esc = (s) =>
      s.replace(
        /[&<>"]/g,
        (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch],
      );
    const md = (s) =>
      esc(s.replace(/\\\|/g, "|"))
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    const KIND = { look: "Look", ops: "Ops", live: "Live account" };

    // Group: phase -> section -> items, in file order.
    const phases = new Map();
    for (const c of checks) {
      if (!phases.has(c.phase)) phases.set(c.phase, new Map());
      const secs = phases.get(c.phase);
      if (!secs.has(c.section)) secs.set(c.section, []);
      secs.get(c.section).push(c);
    }
    const order = [...phases.keys()].sort((a, b) => a - b);

    const main = document.getElementById("main");
    const index = document.getElementById("index");
    const phaseEls = new Map();

    for (const p of order) {
      const sec = document.createElement("section");
      sec.className = "phase";
      sec.id = "p" + p;
      const head = document.createElement("div");
      head.className = "phase-head";
      head.innerHTML =
        '<span class="tag">P' +
        p +
        '</span><h2></h2><span class="pcount"></span>';
      head.querySelector("h2").textContent = DATA.phases[p] || "Phase " + p;
      sec.appendChild(head);
      const groups = [];
      for (const [name, items] of phases.get(p)) {
        const det = document.createElement("details");
        det.className = "group";
        det.open = phases.get(p).size <= 3;
        const sum = document.createElement("summary");
        sum.innerHTML =
          '<span class="gname"></span><span class="gcount"></span>';
        sum.querySelector(".gname").textContent = name;
        det.appendChild(sum);
        const ol = document.createElement("ol");
        ol.className = "items";
        for (const c of items) ol.appendChild(makeRow(c));
        det.appendChild(ol);
        sec.appendChild(det);
        groups.push({ det, items, count: sum.querySelector(".gcount") });
      }
      main.appendChild(sec);
      const a = document.createElement("a");
      a.href = "#p" + p;
      a.innerHTML =
        '<span class="pn">P' +
        p +
        '</span><span class="pt"></span><span class="pc"></span>';
      a.querySelector(".pt").textContent = DATA.phases[p] || "";
      index.appendChild(a);
      phaseEls.set(p, {
        sec,
        groups,
        count: head.querySelector(".pcount"),
        link: a,
      });
    }
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "No checks match. Clear the search or the filters.";
    empty.hidden = true;
    main.appendChild(empty);

    function makeRow(c) {
      const li = document.createElement("li");
      li.className = "item";
      const box = document.createElement("input");
      box.type = "checkbox";
      box.id = "c-" + c.id;
      box.disabled = true;
      box.setAttribute("aria-label", "Ticked");
      const body = document.createElement("div");
      body.className = "body";
      const text = document.createElement("label");
      text.className = "text";
      text.htmlFor = box.id;
      text.innerHTML = md(c.text);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML =
        '<span class="kind ' +
        c.kind +
        '">' +
        KIND[c.kind] +
        "</span>" +
        (c.where ? '<span class="where">' + md(c.where) + "</span>" : "");
      const stamp = document.createElement("span");
      stamp.className = "ticked-at";
      meta.appendChild(stamp);
      const noteBtn = document.createElement("button");
      noteBtn.className = "note-btn";
      noteBtn.type = "button";
      noteBtn.textContent = "Add note";
      noteBtn.hidden = true;
      meta.appendChild(noteBtn);
      body.append(text, meta);
      if (c.note) {
        const prior = document.createElement("div");
        prior.className = "prior";
        prior.innerHTML = md(c.note);
        body.appendChild(prior);
      }
      const noteBox = document.createElement("textarea");
      noteBox.className = "note";
      noteBox.id = "n-" + c.id;
      noteBox.placeholder = "What you saw, or what needs fixing";
      noteBox.setAttribute("aria-label", "Note");
      noteBox.hidden = true;
      body.appendChild(noteBox);
      li.append(box, body);
      box.addEventListener("change", () => save(c.id, { done: box.checked }));
      noteBtn.addEventListener("click", () => {
        rows.get(c.id).open = true;
        noteBox.hidden = false;
        noteBtn.hidden = true;
        noteBox.focus();
      });
      noteBox.addEventListener("change", () =>
        save(c.id, { note: noteBox.value.trim() }),
      );
      rows.set(c.id, {
        li,
        box,
        noteBtn,
        noteBox,
        stamp,
        hay: (
          c.text +
          " " +
          c.where +
          " " +
          c.section +
          " p" +
          c.phase
        ).toLowerCase(),
      });
      return li;
    }

    function paintRow(id) {
      const r = rows.get(id),
        t = ticks.get(id) || {};
      r.box.checked = !!t.done;
      r.li.classList.toggle("done", !!t.done);
      r.stamp.textContent =
        t.done && t.at ? "ticked " + String(t.at).slice(0, 10) : "";
      if (document.activeElement !== r.noteBox) r.noteBox.value = t.note || "";
      r.noteBox.hidden = !(t.note || r.open);
      r.noteBtn.hidden = !writable || !r.noteBox.hidden;
      r.box.disabled = !writable;
      r.noteBox.readOnly = !writable;
    }

    function applyFilters() {
      let shown = 0;
      for (const c of checks) {
        const r = rows.get(c.id),
          t = ticks.get(c.id);
        const vis =
          (filters.kinds.size === 0 || filters.kinds.has(c.kind)) &&
          (!filters.q || r.hay.includes(filters.q)) &&
          !(filters.hide && t && t.done);
        r.li.hidden = !vis;
        if (vis) shown++;
      }
      for (const [p, el] of phaseEls) {
        let any = false;
        for (const g of el.groups) {
          const vis = g.items.some((c) => !rows.get(c.id).li.hidden);
          g.det.hidden = !vis;
          if (vis) any = true;
          if (filters.q && vis) g.det.open = true;
        }
        el.sec.hidden = !any;
      }
      empty.hidden = shown > 0;
    }

    function paintCounts() {
      let done = 0;
      for (const c of checks) if (ticks.get(c.id)?.done) done++;
      const total = checks.length;
      document.getElementById("count").textContent =
        done + " / " + total + " ticked";
      document.getElementById("barfill").style.width =
        (total ? (done / total) * 100 : 0) + "%";
      const bar = document.getElementById("bar");
      bar.setAttribute("aria-valuemax", String(total));
      bar.setAttribute("aria-valuenow", String(done));
      for (const [p, el] of phaseEls) {
        let pd = 0,
          pt = 0;
        for (const g of el.groups) {
          const gd = g.items.filter((c) => ticks.get(c.id)?.done).length;
          g.count.textContent = gd + " / " + g.items.length;
          pd += gd;
          pt += g.items.length;
        }
        el.count.textContent = pd + " / " + pt;
        el.link.querySelector(".pc").textContent =
          pt - pd ? String(pt - pd) : "clear";
        el.link.classList.toggle("clear", pd === pt);
      }
    }

    async function save(id, patch) {
      if (!db || !writable) return;
      const prev = ticks.get(id) || { done: false, note: "" };
      const next = { done: !!prev.done, note: prev.note || "", ...patch };
      if (patch.done !== undefined)
        next.at = patch.done ? new Date().toISOString() : "";
      const c = byId.get(id);
      ticks.set(id, next);
      paintRow(id);
      paintCounts();
      applyFilters();
      try {
        const ref = db.collection("ticks").doc(id);
        if (!next.done && !next.note) await ref.delete();
        else
          await ref.set({
            done: next.done,
            note: next.note,
            at: next.at || "",
            phase: c.phase,
            by: me,
          });
        setStatus("Saved", false);
      } catch (e) {
        ticks.set(id, prev);
        paintRow(id);
        paintCounts();
        applyFilters();
        setStatus(
          e && e.code === "not_granted"
            ? "You can view ticks but not change them."
            : "Couldn't save that tick. Try again.",
          true,
        );
      }
    }

    function setStatus(msg, warn) {
      const s = document.getElementById("status");
      s.textContent = msg;
      s.classList.toggle("warn", !!warn);
    }

    document.getElementById("q").addEventListener("input", (e) => {
      filters.q = e.target.value.trim().toLowerCase();
      applyFilters();
    });
    for (const k of ["look", "ops", "live"]) {
      const b = document.getElementById("k-" + k);
      b.addEventListener("click", () => {
        const on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", String(on));
        on ? filters.kinds.add(k) : filters.kinds.delete(k);
        applyFilters();
      });
    }
    const hide = document.getElementById("hide");
    hide.addEventListener("click", () => {
      filters.hide = hide.getAttribute("aria-pressed") !== "true";
      hide.setAttribute("aria-pressed", String(filters.hide));
      try {
        localStorage.setItem("punch-hide", filters.hide ? "1" : "");
      } catch (e) {}
      applyFilters();
    });
    try {
      if (localStorage.getItem("punch-hide")) {
        filters.hide = true;
        hide.setAttribute("aria-pressed", "true");
      }
    } catch (e) {}

    for (const c of checks) paintRow(c.id);
    paintCounts();
    applyFilters();

    (async () => {
      const claude = window.claude;
      db = claude ? await claude.use("db") : null;
      if (!db) {
        setStatus(
          "Ticks can't load here. Open this page signed in to claude.ai to tick checks.",
          true,
        );
        return;
      }
      const user = await claude.use("user");
      try {
        me = user ? await user.id() : "";
      } catch (e) {
        me = "";
      }
      const canWrite = user ? user.can("data.write") : null;
      writable = canWrite !== false;
      db.collection("ticks").onSnapshot(
        (snap) => {
          const seen = new Set();
          for (const d of snap.docs) {
            if (!byId.has(d.id)) continue;
            const v = d.data() || {};
            ticks.set(d.id, {
              done: !!v.done,
              note: typeof v.note === "string" ? v.note : "",
              at: typeof v.at === "string" ? v.at : "",
            });
            seen.add(d.id);
          }
          for (const id of [...ticks.keys()])
            if (!seen.has(id)) ticks.delete(id);
          for (const c of checks) paintRow(c.id);
          paintCounts();
          applyFilters();
          setStatus(
            writable
              ? "Ticks save for everyone with access."
              : "View only: you can't change ticks.",
            !writable,
          );
        },
        () =>
          setStatus(
            "Lost the connection to saved ticks. Reload the page.",
            true,
          ),
      );
    })();
  })();
</script>
